ShortDescription: An automated momentum bot for Kalshi prediction markets.
Description: |-
  ROM Trader scans liquid Kalshi prediction markets and trades short-term price
  momentum, with take-profit, stop-loss and reversal exits.

  It ships in dry-run: it paper-trades against live prices and places no orders
  until you add your own Kalshi API key and switch live mode on yourself. A
  signals feed shows every market the last sweep looked at and why each one did
  or did not qualify, and a daily loss limit halts the engine on its own.

  Your API key is encrypted with your Windows account and never leaves the PC.

  This is a momentum heuristic, not a proven edge. It has no demonstrated
  profitability, fees and spread work against it, and nothing it produces is
  financial advice.
