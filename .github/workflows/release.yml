name: Build and release

# Tag a version to publish it:
#   npm version 1.1.3 && git push --follow-tags
#
# Running this by hand (workflow_dispatch) builds and tests without publishing,
# which is the safe way to check the pipeline after changing it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Enough to publish a release in this repository. Writing to rom-apps needs a
# separate token; see the mirror step at the bottom for why that is optional.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      # Exercises the credential vault against real Windows DPAPI rather than
      # the stub the unit suite uses.
      - name: Real DPAPI
        run: npm run dpapi

      - name: Build
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never
        env:
          # electron-builder picks these up on its own when they exist, so
          # signing needs no config change - only the secrets.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Checksums
        shell: pwsh
        run: |
          $exe = "release/ROM-Trader-Setup.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ROM-Trader-Setup.exe" | Out-File release/SHA256SUMS.txt -Encoding ascii -NoNewline
          Write-Host "SHA256 $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Trader-Setup
          path: |
            release/ROM-Trader-Setup.exe
            release/ROM-Trader-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 14

      # Publishing to this repository needs no secret at all: the built-in
      # token can always write releases where the workflow runs. This is the
      # canonical build output, and because the repo is public its assets are
      # downloadable with no authentication.
      - name: Publish release here
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            --repo ${{ github.repository }} `
            --title "ROM Trader $($tag.TrimStart('v'))" `
            --generate-notes `
            release/ROM-Trader-Setup.exe `
            release/ROM-Trader-Setup.exe.blockmap `
            release/latest.yml `
            release/SHA256SUMS.txt

      # rom-apps is the update feed installed builds actually check, and it is
      # a different repository, so the built-in token cannot write there.
      #
      # A PAT would work, but the only permission that can create a release is
      # "Contents", which also allows pushing commits - and rom-apps hosts the
      # website. A long-lived secret in CI that can rewrite romapps.xyz is a
      # bad trade for saving one click, so this step is optional.
      #
      # Without RELEASE_TOKEN: run "Publish ROM Trader" in the rom-apps repo,
      # which relays the public assets published above and re-checks their
      # checksum on the way through.
      - name: Mirror to the update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host "::notice::RELEASE_TOKEN is not set. Run the 'Publish ROM Trader' workflow in rom-apps to mirror ${{ github.ref_name }} to the update feed."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            --repo romanstma-cpu/rom-apps `
            --title "ROM Trader $($tag.TrimStart('v'))" `
            --generate-notes `
            release/ROM-Trader-Setup.exe `
            release/ROM-Trader-Setup.exe.blockmap `
            release/latest.yml `
            release/SHA256SUMS.txt
